<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1200" />
<title>OG Image Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #07090f;
    font-family: 'Noto Sans SC', sans-serif;
    color: #eef0f8;
    position: relative;
  }

  /* ── 背景点阵 ── */
  .dot-grid {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(0,212,196,0.18) 1px, transparent 1px);
    background-size: 36px 36px;
    background-position: 0 0;
  }

  /* ── 背景光晕 ── */
  .glow-left {
    position: absolute;
    left: -120px;
    top: -80px;
    width: 560px;
    height: 480px;
    background: radial-gradient(ellipse at center, rgba(0,212,196,0.10) 0%, transparent 70%);
    pointer-events: none;
  }
  .glow-right {
    position: absolute;
    right: -60px;
    bottom: -100px;
    width: 420px;
    height: 380px;
    background: radial-gradient(ellipse at center, rgba(82,100,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── 左侧竖线装饰 ── */
  .left-bar {
    position: absolute;
    left: 64px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, transparent 0%, rgba(0,212,196,0.6) 30%, rgba(0,212,196,0.6) 70%, transparent 100%);
  }
  .left-bar::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00d4c4;
    box-shadow: 0 0 12px #00d4c4;
  }

  /* ── 右侧装饰 ── */
  .corner-mark {
    position: absolute;
    right: 56px;
    top: 52px;
    width: 40px;
    height: 40px;
    border-top: 2px solid rgba(0,212,196,0.5);
    border-right: 2px solid rgba(0,212,196,0.5);
  }
  .corner-mark-bl {
    position: absolute;
    left: 44px;
    bottom: 52px;
    width: 40px;
    height: 40px;
    border-bottom: 2px solid rgba(0,212,196,0.3);
    border-left: 2px solid rgba(0,212,196,0.3);
  }

  /* ── 主内容 ── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 0 112px 0 112px;
  }

  /* 角标签 */
  .top-label {
    position: absolute;
    top: 48px;
    left: 112px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: rgba(0,212,196,0.7);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .top-label::before {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: rgba(0,212,196,0.7);
  }

  /* 名字 */
  .name {
    font-size: 128px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-bottom: 24px;
    position: relative;
  }
  .name .accent {
    color: #00d4c4;
  }

  /* 分隔线 */
  .divider {
    width: 480px;
    height: 1px;
    background: linear-gradient(to right, rgba(0,212,196,0.8), rgba(0,212,196,0.1), transparent);
    margin-bottom: 28px;
  }

  /* 标语 */
  .tagline {
    font-size: 32px;
    font-weight: 700;
    color: #eef0f8;
    line-height: 1.3;
    margin-bottom: 18px;
    max-width: 700px;
  }

  /* 副标题 */
  .subtitle {
    font-size: 16px;
    font-weight: 300;
    color: rgba(180,188,210,0.75);
    letter-spacing: 0.05em;
    margin-bottom: 40px;
  }

  /* 徽章 */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,212,196,0.08);
    border: 1px solid rgba(0,212,196,0.30);
    border-radius: 4px;
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: #00d4c4;
    letter-spacing: 0.04em;
  }
  .badge::before {
    content: '◆';
    font-size: 10px;
    opacity: 0.7;
  }

  /* 右侧数据列 */
  .stats-col {
    position: absolute;
    right: 112px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 20px;
  }
  .stat-item {
    text-align: right;
  }
  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 36px;
    font-weight: 500;
    color: #ffffff;
    line-height: 1;
  }
  .stat-value em {
    font-style: normal;
    font-size: 18px;
    color: #00d4c4;
    margin-left: 2px;
  }
  .stat-label {
    font-size: 12px;
    color: rgba(180,188,210,0.55);
    letter-spacing: 0.08em;
    margin-top: 4px;
    font-weight: 300;
  }
  .stat-sep {
    width: 1px;
    height: 20px;
    background: rgba(0,212,196,0.2);
    margin-left: auto;
  }

  /* 底部 URL 栏 */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    border-top: 1px solid rgba(255,255,255,0.05);
    background: rgba(0,212,196,0.03);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 112px;
  }
  .url-text {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: rgba(0,212,196,0.65);
    letter-spacing: 0.08em;
  }
  .bottom-right {
    font-size: 12px;
    color: rgba(180,188,210,0.3);
    letter-spacing: 0.12em;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="dot-grid"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>
  <div class="left-bar"></div>
  <div class="corner-mark"></div>
  <div class="corner-mark-bl"></div>

  <div class="top-label">AI Practitioner · silencebin.com</div>

  <div class="content">
    <div class="name">Bin<span class="accent">哥</span></div>
    <div class="divider"></div>
    <div class="tagline">把 AI 变成学习力、生产力和实际结果</div>
    <div class="subtitle">AI 应用实践者 &nbsp;/&nbsp; AI 全栈落地者 &nbsp;/&nbsp; AI 增长与赋能探索者</div>
    <div class="badge">5000h AI 共生实践</div>
  </div>

  <div class="stats-col">
    <div class="stat-item">
      <div class="stat-value">5000<em>h</em></div>
      <div class="stat-label">AI 共生实践</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat-item">
      <div class="stat-value">~1<em>w</em></div>
      <div class="stat-label">内容影响力</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat-item">
      <div class="stat-value">4<em>类</em></div>
      <div class="stat-label">核心能力方向</div>
    </div>
  </div>

  <div class="bottom-bar">
    <span class="url-text">silencebin.com</span>
    <span class="bottom-right">© 2026</span>
  </div>

</body>
</html>
